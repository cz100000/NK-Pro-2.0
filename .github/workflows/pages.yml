name: Publish NK-Pro 2.0 UX-Demo
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Validate and stage demo (only synthetic data)
        shell: bash
        run: |
          test -s index.html && test -s styles.css && test -s app.js && test -s demo-ledger.js && test -s synthetic-billing.js && test -s synthetic-property.js && test -s synthetic-case-billing.js && test -s synthetic-workflow.js && test -s synthetic-letters.js && test -s legacy-letter-engine.js && test -s letter-workspace-ui.js && test -s legacy-landlord-documents.js && test -s synthetic-review.js && test -s synthetic-estate.js && test -s synthetic-master-ui.js && test -s water-detail.js && test -s experimental/settlement-cost.js
          node --check app.js
          node --check demo-ledger.js
          node --check synthetic-billing.js
          node --check synthetic-property.js
          node --check synthetic-case-billing.js
          node --check synthetic-workflow.js
          node --check synthetic-letters.js
          node --check legacy-letter-engine.js
          node --check letter-workspace-ui.js
          node --check legacy-landlord-documents.js
          node --check synthetic-review.js
          node --check synthetic-estate.js
          node --check synthetic-master-ui.js
          node --check water-detail.js
          node --check experimental/settlement-cost.js
          node --test --test-reporter=tap tests/*.test.cjs > /tmp/nkpro2-tests.tap
          node tests/browser-visual-e2e.cjs
          tail -n 24 /tmp/nkpro2-tests.tap
          if grep -Eq 'nkpro_browser_v85_qualitaets_cockpit_data|/drive/v3/files' app.js; then
            echo 'Prohibited production-storage/Drive integration detected'; exit 1
          fi
          test -s status.html && test -s status.js
          node --check status.js
          node --check scripts/build-status.cjs
          mkdir -p _site
          node scripts/build-status.cjs /tmp/nkpro2-tests.tap _site/status.json
          cp index.html styles.css app.js demo-ledger.js synthetic-billing.js synthetic-property.js synthetic-case-billing.js synthetic-workflow.js synthetic-letters.js legacy-letter-engine.js letter-workspace-ui.js legacy-landlord-documents.js synthetic-review.js synthetic-estate.js synthetic-master-ui.js water-detail.js status.html status.js _site/
          mkdir -p _site/experimental
          cp experimental/settlement-cost.js _site/experimental/
          touch _site/.nojekyll
          # Allowlist publishes only the synthetic reference formula, never pinned originals or tenant fixtures.
          test "$(find _site -type f | wc -l)" -eq 21
          # Essential release gate: do not publish a site whose HTML points to missing JS/CSS.
          node -e 'const fs=require("node:fs"),path=require("node:path");
            const html=fs.readFileSync("_site/index.html","utf8");
            const refs=[...html.matchAll(/(?:src|href)="(\.\/[^"]+)"/g)].map(x=>x[1].split("?")[0]);
            if(!refs.length)throw new Error("No referenced assets found in staged index");
            for(const ref of refs){
              const file=path.join("_site",ref);
              if(!fs.existsSync(file)||!fs.statSync(file).isFile()||fs.statSync(file).size===0)
                throw new Error("Published site would have missing asset: "+ref);
            }
            console.log("PUBLISH_ASSETS_OK:",refs.length,"referenced files present");'
          test ! -f _site/tests/reference/billing-calculation-v99.4.86.js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Allow Pages artifact indexing to settle
        run: sleep 8
      - id: deployment
        uses: actions/deploy-pages@v4
