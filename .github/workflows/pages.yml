name: Publish NK-Pro 2.0 UX-Demo
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Validate and stage demo (only synthetic data)
        shell: bash
        run: |
          test -s index.html && test -s styles.css && test -s app.js && test -s demo-ledger.js
          node --check app.js
          node --check demo-ledger.js
          npm test
          if grep -Eq 'nkpro_browser_v85_qualitaets_cockpit_data|/drive/v3/files' app.js; then
            echo 'Prohibited production-storage/Drive integration detected'; exit 1
          fi
          mkdir -p _site
          cp index.html styles.css app.js demo-ledger.js _site/
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
