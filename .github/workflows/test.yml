name: Test synthetic demo ledger
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate allowlisted private client, still without real personal data
        shell: bash
        run: |
          node --check private/private-model.js
          node --check private/vault-crypto.js
          node --check private/drive-adapter.js
          node --check private/private-app.js
          node --check private/private-sw.js
          node --check scripts/verify-private-snapshot.cjs
          node --check scripts/build-private-site.cjs
          node scripts/build-private-site.cjs
          node -e 'const fs=require("node:fs"); const h=fs.readFileSync("private/index.html","utf8")+fs.readFileSync("private/private-app.js","utf8"); const files=["index.html","private-model.js","vault-crypto.js","drive-adapter.js","private-app.js","private.css","private-sw.js","private.webmanifest"]; for(const f of files) if(!fs.existsSync("private/"+f)) throw Error("Missing private dependency: "+f); const y=fs.readFileSync(".github/workflows/pages.yml","utf8"); const stage=y.split("\n").find(x=>/^\s*cp private\/index.html.*_site\/private\/$/.test(x)); if(!stage)throw Error("Private allowlist missing"); for(const f of files)if(!stage.includes("private/"+f))throw Error("Missing allowlisted file "+f); if(/cp -r private\//.test(y)||/cp private\/\*/.test(y))throw Error("Unsafe wildcard private staging"); const publicHtml=fs.readFileSync("index.html","utf8"); if(publicHtml.includes("private/private-app.js"))throw Error("Private scripts linked into demo");'
      - run: npm test
      - name: Preserve isolated static private-hosting package
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: nkpro2-private-site-static
          path: dist-private/
          if-no-files-found: error
          retention-days: 30
      - name: Chromium real-click and responsive visual acceptance
        run: node tests/browser-visual-e2e.cjs
      - name: Chromium private encrypted-vault desktop/mobile acceptance
        run: node tests/private-browser-e2e.cjs
      - name: Preserve desktop/mobile screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nkpro07-visual-acceptance
          path: _visual-test-artifacts/*.png
          if-no-files-found: warn
          retention-days: 14
