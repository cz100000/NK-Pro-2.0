name: Test synthetic demo ledger
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate isolated private app without deploying it
        shell: bash
        run: |
          node --check private/private-model.js
          node --check private/vault-crypto.js
          node --check private/drive-adapter.js
          node --check private/private-app.js
          node --check scripts/verify-private-snapshot.cjs
          node -e 'const fs=require("node:fs"); const h=fs.readFileSync("private/index.html","utf8"); for(const f of ["private-model.js","vault-crypto.js","drive-adapter.js","private-app.js","private.css"]) if(!h.includes("./"+f)||!fs.existsSync("private/"+f)) throw Error("Missing private dependency: "+f); const y=fs.readFileSync(".github/workflows/pages.yml","utf8"); if(/cp\s+.*private\//.test(y)||/copy\s+.*private\//.test(y)) throw Error("Unsafe private staging in public Pages"); const publicHtml=fs.readFileSync("index.html","utf8"); if(publicHtml.includes("private/private-app.js"))throw Error("Private scripts linked into public demo");'
      - run: npm test
      - name: Chromium real-click and responsive visual acceptance
        run: node tests/browser-visual-e2e.cjs
      - name: Preserve nine desktop/mobile screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nkpro07-visual-acceptance
          path: _visual-test-artifacts/*.png
          if-no-files-found: warn
          retention-days: 14
